name: Android APK

# Builds the Android app and uploads the debug APK, which can be
# downloaded from the run's "Artifacts" section and installed on a
# phone (allow installing from unknown sources).
on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # The hosted Ubuntu runners come with the Android SDK installed.
      - name: Build
        run: gradle -p android assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: FreeCol-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      # Also publish it as the "android-latest" pre-release, so it can be
      # downloaded straight to a phone from a fixed link:
      # https://github.com/<owner>/<repo>/releases/download/android-latest/FreeCol-debug.apk
      - name: Publish test APK
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk FreeCol-debug.apk
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest FreeCol-debug.apk \
            --prerelease --target "${{ github.sha }}" \
            --title "Android test build (${{ github.ref_name }})" \
            --notes "Debug build of ${{ github.sha }} from branch ${{ github.ref_name }}. Install on Android 13 or newer (allow installs from this source when asked)."
