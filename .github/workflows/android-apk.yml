name: Android APK

# Builds the Android app and uploads the debug APK, which can be
# downloaded from the run's "Artifacts" section and installed on a
# phone (allow installing from unknown sources).
on:
  push:
  pull_request:

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # The hosted Ubuntu runners come with the Android SDK installed.
      - name: Build
        run: gradle -p android assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: FreeCol-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
