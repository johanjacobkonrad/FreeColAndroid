plugins {
    id 'com.android.application'
}

// The shared engine (launcher, common, server/AI) is synced from the
// main source tree; the desktop client is deliberately left out.
def engineSrc = layout.buildDirectory.dir('generated/engine-src')
def engineAssets = layout.buildDirectory.dir('generated/engine-assets')
def artAssets = layout.buildDirectory.dir('generated/art-assets')
// The music, made smaller by android/encode-music.sh (none if it was not run).
def musicAssets = layout.buildDirectory.dir('generated/music-assets')

def syncEngineSources = tasks.register('syncEngineSources', Sync) {
    from('../../src') {
        include 'net/sf/freecol/FreeCol.java'
        include 'net/sf/freecol/common/**/*.java'
        include 'net/sf/freecol/server/**/*.java'
    }
    into engineSrc
}

// Game data needed by the engine: rules, English strings and the
// base compatibility files.  Images and other languages come later.
def syncEngineAssets = tasks.register('syncEngineAssets', Sync) {
    from('../../data') {
        include 'rules/**'
        include 'base/*.xml'
        include 'strings/FreeColMessages.properties'
        include 'strings/plurals.xml'
    }
    into engineAssets.map { it.dir('data') }
}

// The artwork the map and colony screens need, from data/default (the whole of it is
// about 180 MB).  Only the standard-size images: the ".size9" ones
// are for zooming in on big screens.
def syncArtAssets = tasks.register('syncArtAssets', Sync) {
    from('../../data/default') {
        include 'resources.properties'
        include 'resources/images/terrain/*/center*.png'
        include 'resources/images/terrain/beach/*.png'
        include 'resources/images/terrain/unexplored/*.png'
        include 'resources/images/terrain/hills/*.png'
        include 'resources/images/terrain/mountains/*.png'
        include 'resources/images/forest/*/*.png'
        include 'resources/images/units/*/*.png'
        include 'resources/images/settlements/*.png'
        include 'resources/images/bonus/*.png'
        include 'resources/images/misc/*.png'
        include 'resources/images/buildings/*.png'
        include 'resources/images/goods/*.png'
        include 'resources/images/coat-of-arms/*.png'
        include 'resources/images/ui/landing.png'
        // Founding fathers' pictures, by kind (reports, Colopedia).
        include 'resources/images/ui/trade.png'
        include 'resources/images/ui/exploration.png'
        include 'resources/images/ui/military.png'
        include 'resources/images/ui/political.png'
        include 'resources/images/ui/religious.png'
        // The Declaration of Independence, shown when you declare.
        include 'resources/images/ui/doi.png'
        include 'resources/images/ui/victory.png'
        // Sound effects (the music is packed separately, smaller).
        include 'resources/sound/**/*.ogg'
        include 'resources/images/river/*.png'
        // Only the standard size: the ".size9" images are most of it.
        exclude '**/*.size*.png'
        // Forests: the plain image and the ones with a gap for a river
        // (mixed0110.png), but not the corner pieces (mixed-n.png).
        exclude 'resources/images/forest/*/*-?.png'
    }
    // The base data's terrain masks, for soft edges between terrain types.
    from('../../data/base') {
        include 'resources.properties'
        include 'resources/images/masks/*.png'
        exclude '**/*.size*.png'
        into 'base'
    }
    into artAssets.map { it.dir('art') }
}

android {
    namespace 'net.sf.freecol.android'
    compileSdk 35

    defaultConfig {
        applicationId 'net.sf.freecol.android'
        minSdk 33
        targetSdk 35
        versionCode 2
        versionName '0.2-phase2'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    sourceSets {
        main {
            java.srcDir engineSrc
            assets.srcDirs 'src/main/assets', engineAssets, artAssets, musicAssets
        }
    }

    packaging {
        resources {
            // Keep META-INF/services so StAX can find Woodstox.
            excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*',
                         'META-INF/versions/**']
        }
    }

    lint {
        abortOnError false
    }
}

tasks.named('preBuild') {
    dependsOn syncEngineSources, syncEngineAssets, syncArtAssets
}

dependencies {
    implementation 'commons-cli:commons-cli:1.4'
    // Android has no javax.xml.stream (StAX): add the API and Woodstox.
    implementation 'javax.xml.stream:stax-api:1.0-2'
    implementation 'com.fasterxml.woodstox:woodstox-core:6.7.0'
    compileOnly 'com.github.spotbugs:spotbugs-annotations:4.8.6'
}
